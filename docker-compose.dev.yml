# Dev overrides. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --watch
# Requires:
#   backend/.env.dev  (from .env.dev.example)
#   web/.env.dev      (from .env.dev.example)
#
# Nginx runs inside the `web` container (image copies web/docker/nginx.conf).
# Dev bind-mounts that file so nginx edits apply after:
#   docker compose ... exec web nginx -s reload
# App URL: http://localhost:8090/vises/  (host :8090 → container :80)
#
# Watch mode (develop.watch): on source changes, Compose rebuilds the service
# image and recreates the container so api/web load the updated code fresh.
# Without --watch, this file still applies env/ports/volumes only.
#
# Remote warning: prefer prod + docker-compose.remote-test.yml on a public host.
# This overlay binds DB/API to loopback; web stays on :8090 (container nginx).

services:
  db:
    env_file:
      - backend/.env.dev
    ports: !override
      - "127.0.0.1:5432:5432"

  api:
    env_file:
      - backend/.env.dev
    ports: !override
      - "127.0.0.1:8100:8100"
    volumes:
      - ./backend/uploads:/uploads
      - ./backend/logs:/logs
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - node_modules/
            - dist/
            - logs/
            - uploads/
            - vises_pg/
            - .env
            - .env.*
            - "*.md"

  web:
    env_file:
      - web/.env.dev
    volumes:
      # Live-edit container nginx without rebuilding the SPA image.
      - ./web/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    develop:
      watch:
        - action: rebuild
          path: ./web
          ignore:
            - node_modules/
            - dist/
            - deploy/
            - docker/nginx.conf
            - .env
            - .env.*
            - "*.md"
