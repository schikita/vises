# Dev overrides. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --watch
# Requires:
#   apps/api/.env.dev  (from .env.dev.example)
#   apps/workflow-worker/.env.dev
#   apps/web/.env.dev  (from .env.dev.example)
#
# Nginx runs inside the `web` container (apps/web/nginx/nginx.conf).
#
# URLs (login / SPA at root):
#   local:  http://localhost:8090/
#   remote: http://go-vises.top/   (DNS A → server; host :80 published)

services:
  db:
    env_file:
      - apps/api/.env.dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./apps/api/db:/var/lib/postgresql

  rabbitmq:
    env_file:
      - apps/api/.env.dev
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - ./apps/api/rabbitmq:/var/lib/rabbitmq

  api:
    env_file:
      - apps/api/.env.dev
    ports:
      - '127.0.0.1:8100:8100'
    volumes:
      - ./apps/api/uploads:/uploads
      - ./apps/api/logs:/logs
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
          ignore:
            - node_modules/
            - dist/
            - .env
            - .env.*
            - '*.md'
            - db/
            - rabbitmq/
            - uploads/
            - logs/
        - action: rebuild
          path: ./packages
          ignore:
            - '**/node_modules/**'
            - '**/dist/**'

  workflow-worker:
    env_file:
      - apps/workflow-worker/.env.dev
    ports:
      - '127.0.0.1:8101:8101'
    volumes:
      - ./apps/api/uploads:/uploads
      - ./apps/api/logs:/logs
    develop:
      watch:
        - action: rebuild
          path: ./apps/workflow-worker
          ignore:
            - node_modules/
            - dist/
            - .env
            - .env.*
            - '*.md'
        - action: rebuild
          path: ./packages
          ignore:
            - '**/node_modules/**'
            - '**/dist/**'

  web:
    env_file:
      - apps/web/.env.dev
    ports:
      - '80:80'
      - '8090:80'
    volumes:
      - ./apps/web/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
          ignore:
            - node_modules/
            - dist/
            - docker/nginx.conf
            - .env
            - .env.*
            - '*.md'
