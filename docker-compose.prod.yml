services:
  db:
    env_file:
      - apps/api/.env.prod
    volumes:
      - ./apps/api/db:/var/lib/postgresql

  rabbitmq:
    env_file:
      - apps/api/.env.prod
    volumes:
      - ./apps/api/rabbitmq:/var/lib/rabbitmq

  api:
    env_file:
      - apps/api/.env.prod
    volumes:
      - ./apps/api/uploads:/uploads
      - ./apps/api/logs:/logs

  workflow-worker:
    env_file:
      - apps/workflow-worker/.env.prod
    volumes:
      - ./apps/workflow-worker/uploads:/uploads
      - ./apps/workflow-worker/logs:/logs

  web:
    env_file:
      - apps/web/.env.prod
    volumes:
      - ./apps/web/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
