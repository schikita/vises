# Prod overrides. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires:
#   apps/api/.env.prod
#   apps/workflow-worker/.env.prod
#   apps/web/.env.prod

services:
  db:
    env_file:
      - apps/api/.env.prod

  api:
    env_file:
      - apps/api/.env.prod
    volumes:
      - vises_uploads:/uploads
      - vises_logs:/logs

  workflow-worker:
    env_file:
      - apps/workflow-worker/.env.prod
    volumes:
      - vises_uploads:/uploads
      - vises_logs:/logs

  web:
    env_file:
      - apps/web/.env.prod

volumes:
  vises_uploads:
  vises_logs:
