server {
    listen 80;
    listen [::]:80;
    # Domain + IP + catch-all (browser Host may be IP:8090 during testing).
    server_name go-vises.top www.go-vises.top 185.251.38.215 _;

    # Relative Location so host-mapped port 8090 is preserved (RISK-007).
    absolute_redirect off;
    server_tokens off;

    # Match deploy upload body limit (REQ-004).
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Legacy /vises deploy prefix → root (login + SPA).
    location = /vises {
        return 301 /;
    }

    location = /vises/ {
        return 301 /;
    }

    location ~ ^/vises/(.*)$ {
        return 301 /$1;
    }

    # API must not be swallowed by SPA try_files.
    location ^~ /api/ {
        proxy_pass http://api:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    # Fingerprinted Vite assets — long cache; index.html is not under here.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
