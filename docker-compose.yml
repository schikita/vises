# Shared Compose skeleton (db + api + web).
# Dev (with image rebuild on code changes):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --watch
# Prod:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Env is injected via dev/prod env_file (not baked into images).
# Copy env examples first — see backend/.env.*.example and web/.env.*.example.

services:
  db:
    image: postgres:18.6-alpine
    volumes:
      - ./backend/vises_pg:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vises"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  vises_pg:
  vises_uploads:
  vises_logs:
