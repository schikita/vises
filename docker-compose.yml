services:
  db:
    image: postgres:18.6-alpine
    env_file:
      - backend/.env
    volumes:
      - ./backend/vises_pg:/var/lib/postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vises"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: vises-api:local
    env_file:
      - backend/.env
    ports:
      - "8100:8100"
    volumes:
      - ./backend/vises_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    image: vises-web:local
    env_file:
      - web/.env
    ports:
      - "8090:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  vises_pg:
  vises_uploads:
