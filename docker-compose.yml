services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: vises
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vises}
      POSTGRES_DB: vises
    volumes:
      - ./backend/vises_pg:/var/lib/postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vises"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Default api image has no Patchright browser binaries (DEC-010 / DEC-005).
  # Portal autofill: host Nest Dev + HTTP POST /api/apps/:id/portal-autofill
  # (not Nest-DI CLI). See .env.example for VISES_PORTAL_* and :5500 stand-in.
  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vises:${POSTGRES_PASSWORD:-vises}@db:5432/vises
      # Must not be dev-change-me: Nest image runs NODE_ENV=production (DEC-007).
      JWT_SECRET: ${JWT_SECRET:-vises-local-dev-only}
      # Local demo UX default on; production hosts should set false / omit (DEC-001).
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8100:8100"
    volumes:
      - ./backend/vises_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vises_pg:
  vises_uploads:
