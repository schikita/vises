server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Relative Location so host-mapped port 8090 is preserved (RISK-007).
    absolute_redirect off;

    # Match deploy upload body limit (REQ-004).
    client_max_body_size 20m;

    location = /vises {
        return 301 /vises/;
    }

    location = / {
        return 302 /vises/;
    }

    # More specific than /vises/ so API is not swallowed by SPA try_files.
    location ^~ /vises/api/ {
        proxy_pass http://api:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Fingerprinted Vite assets — long cache; index.html is not under here.
    location ^~ /vises/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /vises/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /vises/index.html;
    }
}
