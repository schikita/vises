# Optional host nginx (only if you want a reverse proxy in front of Docker).
# Preferred remote HTTP path: container nginx only —
#   docker-compose.remote-test.yml publishes host :80 → web:80
#   config lives in web/docker/nginx.conf (baked into image + bind-mounted)
#
# If you still need host nginx:
#   sudo cp web/deploy/nginx-vises-http-test.conf /etc/nginx/sites-available/vises
# and point proxy_pass at 127.0.0.1:8090 (change remote-test web ports back to
# 127.0.0.1:8090:80 first).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;
    server_tokens off;

    location = / {
        return 302 /vises/;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }
}
