# Legacy host-nginx sample (static under /var/www/vises, API on :8100).
# Prefer HTTP test deploy: nginx-vises-http-test.conf + docker-compose.remote-test.yml
# (proxy to Docker web on 127.0.0.1:8090 — SPA + /vises/api/ in one place).

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;

    location = / {
        return 302 /vises/;
    }

    # SPA base is `/vises/` → API calls go to `/vises/api/` (parity with vises-path.conf).
    location ^~ /vises/api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    location ^~ /vises/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /vises/ {
        try_files $uri $uri/ /vises/index.html;
    }
}
