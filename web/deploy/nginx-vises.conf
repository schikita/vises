server {
    listen 8090;
    listen [::]:8090;
    server_name 185.244.50.22 _;

    root /var/www/vises;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
